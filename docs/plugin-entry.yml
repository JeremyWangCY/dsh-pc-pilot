description:
  en: "Windows computer-use for DeepSeek Harness: one 'computer' tool with the standard click/double-click/drag/move/scroll/keypress/type/wait/screenshot actions, ordered batches, UIA accessibility targeting, state-bound coordinates, current PNG observations, background synthetic input (never steals focus), and real SendInput when required. Screenshots are occlusion-immune per-window captures (Windows Graphics Capture bridge, PrintWindow ladder) with no screen-DC degradation; running activity is shown in a frosted status pill with a breathing dot."
  zh: "适用于 DeepSeek Harness 的 Windows 电脑操作插件：单一 computer 工具支持标准点击/双击/拖拽/移动/滚动/按键/输入/等待/截图动作、顺序批处理、UIA 无障碍定位、绑定状态的坐标、最新 PNG 观察、后台合成输入（不抢焦点），必要时使用真实 SendInput；截图全部遮挡免疫（Windows Graphics Capture 桥 + PrintWindow 阶梯，无屏幕 DC 降级），运行期间屏幕上方显示毛玻璃状态条与呼吸灯点。"
